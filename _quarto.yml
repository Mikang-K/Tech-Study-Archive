  sidebar:
    title: "Technical Study Archive"
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: 홈
      - href: roadmap.qmd
        text: 학습 로드맵
      - section: "GPU Scheduling & Orchestration"
