project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"

website:
  title: "Technical Study Archive"

  sidebar:
    title: "Technical Study Archive"
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: 홈
      - href: roadmap.qmd
        text: 학습 로드맵

lang: ko

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "목차"
    number-sections: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: false
